<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Phone</title>
    <script src="../../static/scripts/logo_element.js"></script>
    <link rel="stylesheet" href="../../static/css/public_website/registration_business.css" />

</head>

<body>



    <div class="content">
        <div class="logo-padding">
            <logo-on-page></logo-on-page>
        </div>
        <div class="frame17">

            <div class="registration">
                <div class="reg-ctrl">
                    <h1 class="reg">Регистрация</h1>

                    <span class="title-for-input">Имя</span>

                    <div class="input-container">
                        <input type="text" placeholder="Иван">
                    </div>

                    <span class="title-for-input">Фамилия</span>

                    <div class="input-container">
                        <input type="text" placeholder="Иванов">
                    </div>

                    <span class="title-for-input">Электронная почта</span>

                    <div class="input-container">
                        <input type="email" placeholder="Email address">
                    </div>

                    <span class="title-for-input">Номер мобильного телефона</span>

                    <div class="input-container" id="tel">
                        <input type="tel" id="input-elem" maxlength="18" placeholder="+7 (9XX) XXX XX–XX">
                        <div class="caretca-custom"></div>


                    </div>

                    <button>Зарегистрироваться</button>

                    <h1 class="content">
                        Нажимая кнопку продолжить вы&nbsp;принимаете
                        <a class="inner-url" href="URL_соглашения">Пользовательское соглашение</a>
                        и&nbsp;
                        <a class="inner-url" href="URL_политики">Политику конфиденциальности</a>
                    </h1>
                </div>
            </div>

        </div>
    </div>






    <footer-on-page></footer-on-page>

    <script src="../../static/scripts/formatting_for_phone_numbers.js"></script>
    <script src="../../static/scripts/input_script2.js"></script>




</body>
