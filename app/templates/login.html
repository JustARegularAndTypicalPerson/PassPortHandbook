<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Optionally include a CSS framework for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="../static/css/login.css">
</head>

<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong><a href="{{ url_for('main.index') }}">Pass-port</a></strong></li>
            </ul>
        </nav>

        <h1>Login</h1>

        <!-- Display flash messages if any -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth_bp.login') }}">
            <label for="login">Email or Phone Number:</label>
            <input type="text" id="login" name="login" required autofocus>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log In</button>
        </form>

        <p>Don't have an account? <a href="{{ url_for('auth_bp.register') }}">Register</a></p>

        <footer style="margin-top: 3rem; text-align: center;">
            <small>&copy; 2025 Wiwiwi. All rights reserved.</small>
        </footer>
    </main>
</body>

</html>
